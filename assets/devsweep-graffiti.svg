<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">DevSweep</title>
  <desc id="description">A graffiti-inspired neon green and cyan DevSweep wordmark with paint splashes.</desc>
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff56"/>
      <stop offset="0.52" stop-color="#91f53b"/>
      <stop offset="1" stop-color="#28dfc2"/>
    </linearGradient>
    <filter id="rough-shadow" x="-15%" y="-30%" width="130%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="9" dx="5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="#42e9ca" opacity="0.9">
    <path d="M72 84 154 48l-30 61 75-20-51 57-92-10zM1030 58l77 24-58 26 93 9-85 40-89-50zM95 250l65-20-24 44 69-8-65 34-66-14zM1055 242l69-23-32 45 73-1-87 32-64-22z"/>
    <circle cx="212" cy="68" r="8"/><circle cx="988" cy="230" r="7"/><circle cx="1000" cy="54" r="5"/><circle cx="154" cy="207" r="6"/>
  </g>
  <g transform="rotate(-3 600 165)" text-anchor="middle" filter="url(#rough-shadow)" paint-order="stroke fill">
    <text x="600" y="218" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="194" font-style="italic" font-weight="900" letter-spacing="-8" fill="url(#paint)" stroke="#10251f" stroke-width="28" stroke-linejoin="round">DevSweep</text>
    <text x="600" y="218" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="194" font-style="italic" font-weight="900" letter-spacing="-8" fill="url(#paint)" stroke="#f4ffde" stroke-width="5" stroke-linejoin="round">DevSweep</text>
  </g>
  <g fill="url(#paint)" stroke="#10251f" stroke-width="8" stroke-linejoin="round">
    <path d="m339 250 24 1-7 36q-2 14-12 4l-4-41zM567 249l24 1-6 58q-2 15-13 3l-5-62zM774 247l24 1-8 43q-2 13-12 2l-4-46zM906 243l22 1-5 32q-2 11-11 2l-6-35z"/>
  </g>
  <path d="M294 282Q600 321 913 275" fill="none" stroke="#42e9ca" stroke-width="7" stroke-linecap="round" opacity=".85"/>
  <text x="600" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#b4c8b7">SWEEP THE BUILD-UP</text>
</svg>
