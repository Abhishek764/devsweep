[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devsweep"
version = "0.1.0"
description = "Safely find and remove reclaimable developer junk"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "abhishek764"}]
dependencies = ["tomli>=2; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/Abhishek764/devsweep"
Source = "https://github.com/Abhishek764/devsweep"
Issues = "https://github.com/Abhishek764/devsweep/issues"
Changelog = "https://github.com/Abhishek764/devsweep/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[project.scripts]
devsweep = "devsweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
